name: Evals

# ADR-12/60 as amended by ADR-61: the fixed suite runs on every main push
# (scripted mode — the deterministic harness path) and reports via the job
# summary + a per-run artifact. It never commits back to the repo — the
# owner wants zero bot commits on main; docs/evals/history.jsonl is frozen
# at its pre-ADR-61 contents and grows only when a human records a run
# deliberately. Live-mode runs are manual (workflow_dispatch) and only make
# sense once OPENROUTER_API_KEY exists as a repo secret.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Eval mode"
        type: choice
        default: scripted
        options: [scripted, live]

concurrency:
  group: evals-main
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mullion
          POSTGRES_PASSWORD: mullion
          POSTGRES_DB: mullion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mullion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # db:migrate, not db:push — keeps trigger/custom SQL from migrations
      # (see ci.yml api-integration job).
      - name: Apply DB schema
        run: pnpm --filter @mullion/db db:migrate
        env:
          DATABASE_URL: postgres://mullion:mullion@localhost:5432/mullion
      - name: Run eval suite
        run: pnpm --filter @mullion/evals evals:ci -- --mode "${{ inputs.mode || 'scripted' }}"
        env:
          DATABASE_URL: postgres://mullion:mullion@localhost:5432/mullion
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Render trend
        run: pnpm --filter @mullion/evals trend -- --out docs/evals/trend.md
      - name: Publish job summary
        run: cat docs/evals/trend.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-${{ github.sha }}
          path: |
            docs/evals/history.jsonl
            docs/evals/trend.md
