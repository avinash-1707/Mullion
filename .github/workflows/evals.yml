name: Evals

# ADR-12/60 as amended by ADR-61: the fixed suite runs on every main push
# (scripted mode — the deterministic harness path) and reports via the job
# summary + a per-run artifact. It never commits back to the repo — the
# owner wants zero bot commits on main; docs/evals/history.jsonl is frozen
# at its pre-ADR-61 contents and grows only when a human records a run
# deliberately. Live-mode runs are manual (workflow_dispatch) and only make
# sense once OPENROUTER_API_KEY exists as a repo secret.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Eval mode"
        type: choice
        default: scripted
        options: [scripted, live]

concurrency:
  group: evals-main
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mullion
          POSTGRES_PASSWORD: mullion
          POSTGRES_DB: mullion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mullion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply DB schema
        run: pnpm --filter @mullion/db db:push
        env:
          DATABASE_URL: postgres://mullion:mullion@localhost:5432/mullion
      - name: Run eval suite
        run: pnpm --filter @mullion/evals evals:ci -- --mode "${{ inputs.mode || 'scripted' }}"
        env:
          DATABASE_URL: postgres://mullion:mullion@localhost:5432/mullion
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Render trend
        run: pnpm --filter @mullion/evals trend -- --out docs/evals/trend.md
      - name: Publish job summary
        run: cat docs/evals/trend.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-${{ github.sha }}
          path: |
            docs/evals/history.jsonl
            docs/evals/trend.md
