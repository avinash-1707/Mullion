name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0, reads version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Temporal test server downloads on first use; sandbox tests use the
      # runner's Docker daemon.
      - run: pnpm --filter @mullion/orchestrator test:integration
        env:
          TEMPORAL_INTEGRATION: "1"

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mullion
          POSTGRES_PASSWORD: mullion
          POSTGRES_DB: mullion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mullion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # db:migrate, not db:push — push only syncs the model-derived schema
      # and skips hand-written migration SQL (the ADR-83 stage-sync triggers
      # live in 0012). Migrate runs the same chain prod gets.
      - name: Apply DB schema
        run: pnpm --filter @mullion/db db:migrate
        env:
          DATABASE_URL: postgres://mullion:mullion@localhost:5432/mullion
      - run: pnpm --filter @mullion/api test:integration
        env:
          API_INTEGRATION: "1"
          DATABASE_URL: postgres://mullion:mullion@localhost:5432/mullion
