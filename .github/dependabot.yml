# SHA-pinned actions (Phase 3 audit) still need update PRs — Dependabot
# tracks the pins so they don't fossilize.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
